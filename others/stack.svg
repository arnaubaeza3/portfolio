  <g transform="translate(425, 340)">
    <rect class="card" width="350" height="160" rx="14"/>
    <g transform="translate(24, 24)">
      <rect width="36" height="36" rx="10" fill="rgba(232,198,144,0.10)"/>
      <rect x="11" y="13" width="20" height="14" rx="2" fill="none" stroke="#e8c690" stroke-width="1.6"/>
      <line x1="17" y1="33" x2="25" y2="33" stroke="#e8c690" stroke-width="1.6"/>
      <line x1="21" y1="29" x2="21" y2="33" stroke="#e8c690" stroke-width="1.6"/>
      <text x="50" y="24" class="text title" font-size="17" font-weight="500">Frontend &amp; 3D</text>
