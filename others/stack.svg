      <g transform="translate(68,32)"><rect width="84" height="22" rx="5" class="tag"/><text x="42" y="16" text-anchor="middle" class="tag-text">Resemblyzer</text></g>
      <g transform="translate(160,32)"><rect width="92" height="22" rx="5" class="tag"/><text x="46" y="16" text-anchor="middle" class="tag-text">RAG / TF-IDF</text></g>
    </g>
  </g>

