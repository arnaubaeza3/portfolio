      <circle cx="25" cy="25" r="5" fill="none" stroke="#e8c690" stroke-width="1.6"/>
      <line x1="25" y1="13" x2="25" y2="20" stroke="#e8c690" stroke-width="1.6"/>
      <line x1="25" y1="30" x2="25" y2="37" stroke="#e8c690" stroke-width="1.6"/>
      <line x1="13" y1="25" x2="20" y2="25" stroke="#e8c690" stroke-width="1.6"/>
