      <g transform="translate(68,0)"><rect width="44" height="22" rx="5" class="tag"/><text x="22" y="16" text-anchor="middle" class="tag-text">GLSL</text></g>
      <g transform="translate(120,0)"><rect width="60" height="22" rx="5" class="tag"/><text x="30" y="16" text-anchor="middle" class="tag-text">Chart.js</text></g>
      <g transform="translate(188,0)"><rect width="48" height="22" rx="5" class="tag"/><text x="24" y="16" text-anchor="middle" class="tag-text">ES6+</text></g>
    </g>
  </g>

  <!-- Card: Bajo nivel -->
  <g transform="translate(790, 340)">
    <rect class="card" width="350" height="160" rx="14"/>
    <g transform="translate(24, 24)">
      <rect width="36" height="36" rx="10" fill="rgba(232,198,144,0.10)"/>
      <polygon points="20,11 12,23 21,23 20,33 30,21 21,21 22,11" fill="none" stroke="#e8c690" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="50" y="24" class="text title" font-size="17" font-weight="500">Rendimiento &amp; Bajo nivel</text>
    </g>
    <g transform="translate(24, 88)">
      <g transform="translate(0,0)"><rect width="40" height="22" rx="5" class="tag"/><text x="20" y="16" text-anchor="middle" class="tag-text">perf</text></g>
      <g transform="translate(48,0)"><rect width="48" height="22" rx="5" class="tag"/><text x="24" y="16" text-anchor="middle" class="tag-text">SIMD</text></g>
      <g transform="translate(104,0)"><rect width="60" height="22" rx="5" class="tag"/><text x="30" y="16" text-anchor="middle" class="tag-text">Profiling</text></g>
      <g transform="translate(172,0)"><rect width="48" height="22" rx="5" class="tag"/><text x="24" y="16" text-anchor="middle" class="tag-text">Caché</text></g>

      <g transform="translate(0,32)"><rect width="80" height="22" rx="5" class="tag"/><text x="40" y="16" text-anchor="middle" class="tag-text">Hardening</text></g>
      <g transform="translate(88,32)"><rect width="84" height="22" rx="5" class="tag"/><text x="42" y="16" text-anchor="middle" class="tag-text">UEFI/GRUB</text></g>
    </g>
  </g>

  <!-- ROW 3 (idiomas) -->
  <g transform="translate(60, 520)">
    <rect class="card" width="1080" height="120" rx="14"/>
    <g transform="translate(24, 24)">
      <rect width="36" height="36" rx="10" fill="rgba(232,198,144,0.10)"/>
      <circle cx="25" cy="25" r="11" fill="none" stroke="#e8c690" stroke-width="1.6"/>
      <line x1="14" y1="25" x2="36" y2="25" stroke="#e8c690" stroke-width="1.6"/>
      <text x="50" y="24" class="text title" font-size="17" font-weight="500">Idiomas</text>
