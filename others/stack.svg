    <g transform="translate(24, 80)">
      <g transform="translate(0,0)"><rect width="120" height="24" rx="5" class="tag"/><text x="60" y="17" text-anchor="middle" class="tag-text">Català (nativo)</text></g>
      <g transform="translate(132,0)"><rect width="128" height="24" rx="5" class="tag"/><text x="64" y="17" text-anchor="middle" class="tag-text">Español (nativo)</text></g>
      <g transform="translate(272,0)"><rect width="104" height="24" rx="5" class="tag"/><text x="52" y="17" text-anchor="middle" class="tag-text">English (B2)</text></g>
      <g transform="translate(388,0)"><rect width="100" height="24" rx="5" class="tag"/><text x="50" y="17" text-anchor="middle" class="tag-text">Français (A1)</text></g>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="690" text-anchor="middle" class="dim" font-size="13">arnauserver.me · 100% vanilla · sin frameworks ni dependencias externas</text>
</svg>
